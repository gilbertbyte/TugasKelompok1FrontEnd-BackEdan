<!DOCTYPE html>
<html>
<head>
  <title>Pascal's Triangle Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Pascal's Triangle Generator</h1>

  <div class="controls">
    <div class="control-group">
      <label for="numRows">Rows</label>
      <input type="number" id="numRows" min="1" max="20" value="5">
    </div>

    <div class="control-group">
      <label for="alignment">Alignment</label>
      <select id="alignment" onchange="generateTriangle()">
        <option value="center">Center</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </div>

    <div class="control-group">
      <label for="order">Order</label>
      <select id="order" onchange="generateTriangle()">
        <option value="top">Start from top</option>
        <option value="bottom">Start from bottom</option>
      </select>
    </div>

    <div class="control-group presentation-group">
      <label for="presentation">Presentation</label>
      <select id="presentation" onchange="generateTriangle()">
        <option value="numbers">Numbers</option>
        <option value="ncr">Combinations: nCᵣ</option>
        <option value="expansion" selected>Expansion: (a + b)ⁿ</option>
      </select>
    </div>

    <button onclick="generateTriangle()">Generate</button>
  </div>

  <div id="triangle-container"></div>

  <div id="result-display"></div>

  <script>
    function generateTriangle() {
      const rowsInput = document.getElementById('numRows').value;
      const numRows = parseInt(rowsInput, 10);
      const alignment = document.getElementById('alignment').value;
      const order = document.getElementById('order').value;
      const presentation = document.getElementById('presentation').value;
      const container = document.getElementById('triangle-container');
      const resultDisplay = document.getElementById('result-display');

      container.innerHTML = '';
      resultDisplay.innerHTML = '';

      if (isNaN(numRows) || numRows < 1) return;

      const triangle = [];

      for (let i = 0; i < numRows; i++) {
        triangle[i] = [];
        triangle[i][0] = 1;

        for (let j = 1; j < i; j++) {
          triangle[i][j] = triangle[i - 1][j - 1] + triangle[i - 1][j];
        }

        triangle[i][i] = 1;
      }

      container.className = `alignment-${alignment}`;

      const orderedRows = order === 'bottom' ? [...triangle].reverse() : triangle;

      orderedRows.forEach((rowValues, displayedRowIndex) => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row';
        const rowIndex = order === 'bottom' ? numRows - displayedRowIndex - 1 : displayedRowIndex;

        rowValues.forEach((val, columnIndex) => {
          const cellDiv = document.createElement('div');
          cellDiv.className = 'cell';
          cellDiv.innerHTML = formatValue(val, rowIndex, columnIndex, presentation);

          cellDiv.addEventListener('click', () => {
            document.querySelectorAll('#triangle-container .row').forEach(r => r.classList.remove('row-active'));
            rowDiv.classList.add('row-active');

            showCalculation(rowIndex, columnIndex, val, rowValues, presentation);
          });

          rowDiv.appendChild(cellDiv);
        });

        container.appendChild(rowDiv);
      });
    }

    function formatExpansionTerm(value, pA, pB) {
      if (pA === 0 && pB === 0) return `${value}`;

      let partA = '';
      if (pA === 1) partA = 'a';
      else if (pA > 1) partA = `a<sup>${pA}</sup>`;

      let partB = '';
      if (pB === 1) partB = 'b';
      else if (pB > 1) partB = `b<sup>${pB}</sup>`;

      const vars = partA + partB;
      const coeff = (value === 1 && vars !== '') ? '' : value;

      return `${coeff}${vars}`;
    }

    function formatValue(value, rowIndex, columnIndex, presentation) {
      if (presentation === 'ncr') {
        return `${rowIndex}C${columnIndex}`;
      }

      if (presentation === 'expansion') {
        return `<span class="expansion">${formatExpansionTerm(value, rowIndex - columnIndex, columnIndex)}</span>`;
      }

      return value;
    }

    function factorial(n) {
      let result = 1;
      for (let k = 2; k <= n; k++) result *= k;
      return result;
    }

    function showCalculation(rowIndex, columnIndex, value, rowValues, presentation) {
      const resultDisplay = document.getElementById('result-display');
      let detailHtml = '';

      if (presentation === 'expansion') {
        const fullEquation = rowValues
          .map((val, j) => formatExpansionTerm(val, rowIndex - j, j))
          .join(' + ');

        detailHtml = `
          <p class="calc-title">Persamaan Ekspansi Baris ${rowIndex}:</p>
          <p class="calc-equation" style="font-size: 1.25rem; font-weight: bold; margin: 8px 0; color: #2563eb;">
            (a + b)<sup>${rowIndex}</sup> = ${fullEquation}
          </p>
        `;
      } else if (presentation === 'ncr') {
        detailHtml = `
          <p class="calc-title">${rowIndex}C${columnIndex} &nbsp;=&nbsp; ${rowIndex}! / (${columnIndex}! × (${rowIndex}-${columnIndex})!)</p>
          <p class="calc-step">=&nbsp; ${factorial(rowIndex)} / (${factorial(columnIndex)} × ${factorial(rowIndex - columnIndex)})</p>
          <p class="calc-result">=&nbsp; <strong>${value}</strong></p>
        `;
      } else {
        if (columnIndex === 0 || columnIndex === rowIndex) {
          detailHtml = `
            <p class="calc-title">Baris ${rowIndex}, posisi ${columnIndex}</p>
            <p class="calc-step">Angka di ujung baris selalu = 1</p>
            <p class="calc-result">=&nbsp; <strong>${value}</strong></p>
          `;
        } else {
          detailHtml = `
            <p class="calc-title">Baris ${rowIndex}, posisi ${columnIndex}</p>
            <p class="calc-step">= (baris ${rowIndex - 1}, posisi ${columnIndex - 1}) + (baris ${rowIndex - 1}, posisi ${columnIndex})</p>
            <p class="calc-result">=&nbsp; <strong>${value}</strong></p>
          `;
        }
      }

      const separator = presentation === 'expansion' ? ' <span style="font-weight: bold; margin: 0 4px;">+</span> ' : '';
      const rowItemsHtml = rowValues
        .map((val, j) => {
          const formatted = formatValue(val, rowIndex, j, presentation);
          const isClicked = j === columnIndex;
          return `<span class="row-item${isClicked ? ' row-item-active' : ''}">${formatted}</span>`;
        })
        .join(separator);

      resultDisplay.innerHTML = `
        ${detailHtml}
        <hr class="calc-divider">
        <p class="calc-title">Semua isi baris ${rowIndex}:</p>
        <div class="row-items">${rowItemsHtml}</div>
      `;
    }

    generateTriangle();
  </script>

</body>
</html>
