<!DOCTYPE html>
<html>
<head>
  <title>Pascal's Triangle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- buat user input -->
  <input type="number" id="rows" value="5" min="1" max="20">
  <!-- tombol -->
  <button onclick="draw()">Generate</button>
  <div id="triangle"></div>

  <script>
    function draw() {
      const n = +rows.value;
      triangle.innerHTML = '';
      for (let i = 0; i < n; i++) {
        let row = [1];
        for (let j = 1; j <= i; j++) row.push(row[j - 1] * (i - j + 1) / j);
        triangle.innerHTML += `<div class="row">${row.map(v => `<span>${v}</span>`).join('')}</div>`;
      }
    }
    draw();
  </script>

</body>
</html>
